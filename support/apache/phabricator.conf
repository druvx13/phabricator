# Apache VirtualHost configuration for Phabricator (LAMP stack)
#
# Instructions:
#   1. Replace YOUR_DOMAIN with your actual domain name.
#   2. Replace /path/to/phabricator with the absolute path to your Phabricator install.
#   3. Copy this file to /etc/apache2/sites-available/phabricator.conf  (Ubuntu/Debian)
#      or to /etc/httpd/conf.d/phabricator.conf  (CentOS/RHEL).
#   4. Ubuntu/Debian: sudo a2enmod rewrite && sudo a2ensite phabricator && sudo systemctl reload apache2
#      CentOS/RHEL:   sudo systemctl reload httpd

<VirtualHost *:80>
    ServerName YOUR_DOMAIN
    # ServerAlias www.YOUR_DOMAIN

    DocumentRoot /path/to/phabricator/webroot

    RewriteEngine on
    RewriteRule ^(.*)$  /index.php?__path__=$1  [B,L,QSA]

    <Directory "/path/to/phabricator/webroot">
        Options -MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    # Logging
    ErrorLog  ${APACHE_LOG_DIR}/phabricator_error.log
    CustomLog ${APACHE_LOG_DIR}/phabricator_access.log combined
</VirtualHost>

