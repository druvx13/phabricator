# Nginx config for Phabricator inside Docker (LEMP container)
# Used by docker-compose.yml.  For bare-metal, see phabricator.conf instead.

server {
    listen       80;
    server_name  localhost;

    root /var/www/phabricator/webroot;

    location / {
        index index.php;
        rewrite ^/(.*)$  /index.php?__path__=/$1  last;
    }

    location = /favicon.ico {
        try_files $uri =204;
    }

    location ~ \.php$ {
        fastcgi_pass  php:9000;   # PHP-FPM container on TCP
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }

    location ~ ^/(conf|bin|scripts|support)/ {
        deny all;
        return 403;
    }

    location ~ /\.ht {
        deny all;
    }
}
