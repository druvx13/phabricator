# Nginx server block configuration for Phabricator (LEMP stack)
#
# Instructions:
#   1. Replace YOUR_DOMAIN with your actual domain name.
#   2. Replace /path/to/phabricator with the absolute path to your Phabricator install.
#   3. Replace the fastcgi_pass socket path if your PHP-FPM uses a TCP socket
#      (e.g.  fastcgi_pass 127.0.0.1:9000;).
#   4. Copy to /etc/nginx/sites-available/phabricator  (Ubuntu/Debian)
#      or to /etc/nginx/conf.d/phabricator.conf  (CentOS/RHEL).
#   5. Ubuntu/Debian: sudo ln -s /etc/nginx/sites-available/phabricator \
#                                /etc/nginx/sites-enabled/phabricator
#                     sudo nginx -t && sudo systemctl reload nginx
#      CentOS/RHEL:   sudo nginx -t && sudo systemctl reload nginx

server {
    listen       80;
    server_name  YOUR_DOMAIN;

    root /path/to/phabricator/webroot;

    location / {
        index index.php;
        rewrite ^/(.*)$  /index.php?__path__=/$1  last;
    }

    location = /favicon.ico {
        try_files $uri =204;
    }

    location ~ \.php$ {
        # PHP-FPM Unix socket (adjust version/path as needed)
        fastcgi_pass  unix:/run/php/php8.1-fpm.sock;
        # fastcgi_pass  127.0.0.1:9000;  # TCP socket alternative

        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }

    # Deny access to sensitive directories
    location ~ ^/(conf|bin|scripts|support)/ {
        deny all;
        return 403;
    }

    location ~ /\.ht {
        deny all;
    }

    # Logging
    error_log  /var/log/nginx/phabricator_error.log;
    access_log /var/log/nginx/phabricator_access.log;
}

