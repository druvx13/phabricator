# docker-compose.yml – Phabricator LEMP stack for local development / testing
#
# Stack: Nginx + PHP 8.1-FPM + MariaDB 10.6
#
# Usage:
#   1. Copy .env.example to .env and fill in PHABRICATOR_BASE_URI and PHABRICATOR_MYSQL_PASS.
#   2. docker compose up -d
#   3. docker compose exec php ./bin/storage upgrade --force --user phabricator --password "${PHABRICATOR_MYSQL_PASS}"
#   4. docker compose exec php ./bin/config set phabricator.base-uri "${PHABRICATOR_BASE_URI}"
#   5. Open http://localhost/ in your browser.
#
# Note: This configuration is intended for development/testing only.
#       For production, use a hardened image, non-root DB users, and TLS.

services:

  # ── MariaDB ──────────────────────────────────────────────────────────────
  db:
    image: mariadb:10.6
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-rootpassword}"
      MARIADB_USER: phabricator
      MARIADB_PASSWORD: "${PHABRICATOR_MYSQL_PASS:-phabricatorpassword}"
      # Phabricator creates its own databases; we only need the user.
      MARIADB_DATABASE: phabricator_meta
    volumes:
      - db_data:/var/lib/mysql
      - ./support/mysql/setup.sql:/docker-entrypoint-initdb.d/01-setup.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_allowed_packet=33554432
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PHP-FPM ──────────────────────────────────────────────────────────────
  php:
    image: php:8.1-fpm
    restart: unless-stopped
    working_dir: /var/www/phabricator
    volumes:
      - .:/var/www/phabricator
      - repo_data:/var/repo
      - ./support/php/php.ini.recommended:/usr/local/etc/php/conf.d/99-phabricator.ini:ro
    depends_on:
      db:
        condition: service_healthy
    environment:
      PHABRICATOR_BASE_URI: "${PHABRICATOR_BASE_URI:-http://localhost/}"
    # Install required PHP extensions at container start
    command: >
      sh -c "
        apt-get update -qq &&
        apt-get install -y --no-install-recommends
          libcurl4-openssl-dev libpng-dev libonig-dev libxml2-dev libzip-dev git &&
        docker-php-ext-install gd mbstring pdo_mysql xml zip opcache &&
        php-fpm
      "

  # ── Nginx ─────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www/phabricator:ro
      - ./support/nginx/docker.phabricator.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

volumes:
  db_data:
  repo_data:
